<section
  id="inicio"
  class="relative flex min-h-screen items-center overflow-hidden bg-black px-6 pt-24"
>
  <!-- Video de fondo. Agrega el archivo en public/videos/roca-gym-hero.mp4 -->
  <video
    class="absolute inset-0 h-full w-full object-cover"
    autoplay
    muted
    loop
    playsinline
    poster="/images/facilities/entrenamiento.jpg"
    aria-hidden="true"
  >
    <source src="/videos/roca-gym-hero.mp4" type="video/mp4" />
  </video>
  <div class="absolute inset-0 bg-black/60"></div>

  <!-- FONDO -->
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_70%_40%,rgba(220,38,38,0.18),transparent_45%)]"
  ></div>

  <div
    class="absolute -right-40 top-1/4 h-96 w-96 rounded-full bg-red-600/10 blur-3xl"
  ></div>

  <div
    class="absolute -left-40 bottom-0 h-96 w-96 rounded-full bg-red-900/10 blur-3xl"
  ></div>

  <!-- CONTENIDO -->
  <div class="relative z-10 mx-auto w-full max-w-7xl">
    <div class="max-w-4xl">

      <!-- BADGE -->
      <div
        class="mb-8 inline-flex items-center gap-3 rounded-full border border-red-600/30 bg-red-600/10 px-4 py-2"
      >
        <span class="h-2 w-2 animate-pulse rounded-full bg-red-500"></span>

        <span
          class="text-xs font-bold uppercase tracking-[0.25em] text-red-500"
        >
          Tu mejor versión comienza aquí
        </span>
      </div>

      <!-- TITLE -->
      <h1
        class="text-6xl font-black uppercase leading-[0.85] tracking-tight text-white sm:text-7xl lg:text-9xl"
      >
        ROCA
        <span class="block text-red-600">
          GYM
        </span>
      </h1>

      <!-- DESCRIPTION -->
      <p
        class="mt-8 max-w-2xl text-lg leading-relaxed text-gray-300 sm:text-xl"
      >
        Entrena más fuerte. Supera tus límites.
        Construye la mejor versión de ti.
      </p>

      <!-- BUTTONS -->
      <div class="mt-10 flex flex-col gap-4 sm:flex-row">

        <a
          href="#planes"
          class="group inline-flex items-center justify-center gap-3 rounded-lg bg-red-600 px-7 py-4 text-sm font-black uppercase tracking-wider text-white shadow-[0_0_30px_rgba(220,38,38,0.25)] transition hover:bg-red-500 hover:shadow-[0_0_40px_rgba(220,38,38,0.45)]"
        >
          Ver planes

          <span
            class="transition-transform group-hover:translate-x-1"
          >
            →
          </span>
        </a>

        <a
          href="#instalaciones"
          class="inline-flex items-center justify-center rounded-lg border border-white/20 bg-white/5 px-7 py-4 text-sm font-black uppercase tracking-wider text-white backdrop-blur transition hover:border-red-600/50 hover:bg-red-600/10"
        >
          Conoce el gimnasio
        </a>

      </div>

      <!-- STATS -->
      <div
        class="mt-20 grid max-w-3xl grid-cols-2 gap-6 border-t border-white/10 pt-8 sm:grid-cols-4"
      >

        <div>
          <p class="text-3xl font-black text-white">
            5:00
          </p>

          <p
            class="mt-1 text-xs font-bold uppercase tracking-wider text-gray-500"
          >
            Apertura
          </p>
        </div>

        <div>
          <p class="text-3xl font-black text-red-600">
            7
          </p>

          <p
            class="mt-1 text-xs font-bold uppercase tracking-wider text-gray-500"
          >
            Días
          </p>
        </div>

        <div>
          <p class="text-3xl font-black text-white">
            80
          </p>

          <p
            class="mt-1 text-xs font-bold uppercase tracking-wider text-gray-500"
          >
            Calle
          </p>
        </div>

        <div>
          <p class="text-3xl font-black text-red-600">
            ∞
          </p>

          <p
            class="mt-1 text-xs font-bold uppercase tracking-wider text-gray-500"
          >
            Potencial
          </p>
        </div>

      </div>

    </div>
  </div>
</section>
