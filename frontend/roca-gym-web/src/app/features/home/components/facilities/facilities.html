<section
  id="instalaciones"
  class="relative overflow-hidden border-t border-white/10 bg-black px-4 py-16 sm:px-10 sm:py-24 lg:px-16"
>
  <!-- Efecto de iluminación rojo de fondo -->
  <div class="absolute right-0 top-1/3 h-96 w-96 rounded-full bg-red-600/10 blur-3xl pointer-events-none"></div>
  <div class="absolute left-0 bottom-10 h-80 w-80 rounded-full bg-red-900/10 blur-3xl pointer-events-none"></div>

  <div class="relative mx-auto max-w-7xl">

    <!-- ENCABEZADO DE LA SECCIÓN -->
    <div class="max-w-3xl">
      <span class="text-xs font-black uppercase tracking-[0.3em] text-red-600">
        Nuestras instalaciones
      </span>
      <h2 class="mt-4 text-4xl font-black uppercase leading-tight text-white sm:text-5xl lg:text-6xl">
        Un espacio para <span class="text-red-600">superar tus límites.</span>
      </h2>
      <p class="mt-6 text-lg leading-relaxed text-gray-400">
        Explora las diferentes zonas de ROCA GYM con un recorrido en video real de nuestras instalaciones.
      </p>
    </div>

    <!-- GALERÍA DE TARJETAS CON VIDEO -->
    <div class="mt-16 grid gap-6 lg:grid-cols-3">

      @for (card of facilities(); track card.id) {
        <article
          class="group relative overflow-hidden rounded-2xl border border-white/10 bg-zinc-950 transition duration-300 hover:border-red-600/60 shadow-xl"
          [class]="card.colsSpan"
        >
          <!-- VIDEO DE FONDO -->
          <div class="absolute inset-0 overflow-hidden">
            <video
              [src]="card.video"
              class="h-full w-full object-cover object-center transition-transform duration-700 ease-out group-hover:scale-105"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
            ></video>
          </div>

          <!-- OVERLAYS DE GRADIENTE -->
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
          <div class="absolute inset-0 bg-black/20 transition-opacity duration-300 group-hover:bg-black/30"></div>

          <!-- BADGE SUPERIOR -->
          <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-10">
            <span class="rounded-lg bg-black/70 px-3 py-1 text-[10px] font-black uppercase tracking-widest text-red-400 border border-white/10 backdrop-blur-md">
              {{ card.category }}
            </span>
            <div class="flex items-center gap-1.5 rounded-full bg-black/75 px-3 py-1 text-[11px] font-mono font-bold text-white border border-white/10 backdrop-blur-md">
              <span>🎬</span>
              <span>EN VIVO</span>
            </div>
          </div>

          <!-- CONTENIDO INFERIOR -->
          <div class="absolute bottom-0 left-0 right-0 p-6 sm:p-8 z-10">
            <h3 class="mt-1 text-2xl font-black uppercase text-white sm:text-3xl drop-shadow-md">
              {{ card.title }}
            </h3>

            <p class="mt-2 text-xs leading-relaxed text-gray-300 max-w-xl">
              {{ card.subtitle }}
            </p>
          </div>
        </article>
      }

    </div>

  </div>
</section>
