<section class="border-t border-white/10 bg-zinc-950 px-6 py-20 sm:px-10 lg:px-16">
  <div class="mx-auto max-w-3xl">
    <div class="text-center">
      <span class="text-xs font-black uppercase tracking-[0.3em] text-red-600">Soporte</span>
      <h2 class="mt-4 text-3xl font-black uppercase text-white sm:text-4xl">Preguntas Frecuentes</h2>
      <p class="mx-auto mt-4 text-sm leading-relaxed text-gray-400">
        Resolvemos las dudas más comunes de nuestros nuevos miembros. Si tienes otra, usa el botón de WhatsApp para contactarnos.
      </p>
    </div>

    <div class="mt-12 space-y-4">
      @for (faq of faqs; track faq.q; let i = $index) {
        <div class="rounded-2xl border border-white/10 bg-black/50 overflow-hidden transition-all duration-300" [class.border-red-600]="faq.isOpen">
          <button
            type="button"
            (click)="toggleFaq(i)"
            class="flex w-full items-center justify-between px-6 py-5 text-left focus:outline-none"
          >
            <span class="text-sm font-bold text-white sm:text-base">{{ faq.q }}</span>
            <span
              class="ml-4 flex h-6 w-6 flex-shrink-0 items-center justify-center rounded-full border text-xs font-bold transition-transform duration-300"
              [class.rotate-180]="faq.isOpen"
              [class.border-red-600]="faq.isOpen"
              [class.bg-red-600]="faq.isOpen"
              [class.text-white]="faq.isOpen"
              [class.border-white/20]="!faq.isOpen"
              [class.text-gray-400]="!faq.isOpen"
            >
              ↓
            </span>
          </button>
          
          <div
            class="overflow-hidden transition-all duration-300 ease-in-out"
            [style.maxHeight]="faq.isOpen ? '200px' : '0px'"
            [style.opacity]="faq.isOpen ? '1' : '0'"
          >
            <div class="px-6 pb-6 text-sm leading-relaxed text-gray-400">
              {{ faq.a }}
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
